plugins {
	id 'io.github.brainage04.fabric-mod-conventions' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}
base { archivesName = rootProject.archives_base_name }
loom { mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } } }
configurations { common { canBeResolved = true; canBeConsumed = false }; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common; developmentFabric.extendsFrom common }
workspaceDependencies {
	siblingMaven('FabricModdingConventions') { coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"); siblingDirectory.set(rootProject.layout.projectDirectory.dir('../FabricModdingConventions')) }
	siblingMaven('BrainageLib') { coordinate.set("io.github.brainage04:brainagelib:${project.brainagelib_version}"); siblingDirectory.set(rootProject.layout.projectDirectory.dir('../BrainageLib')) }
}
fabricModConventions { additionalFabricModJsonProperties.add('brainagelib_version') }
modPublishing { github.repository.set('brainage04/SimpleTPA'); licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE')); modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json')); modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md')); modrinth.iconFile.set(rootProject.layout.projectDirectory.file('common/src/main/resources/assets/simpletpa/icon.png')) }
repositories {
	maven { url = uri('../BrainageLib/fabric/build/local-repo') }
	maven { url = uri('https://api.modrinth.com/maven'); content { includeGroup 'maven.modrinth' } }
}
productionGameTests { includeServer = true; includeClient.set(true); clientUseXvfb.set(providers.environmentVariable('GTR_RECORDING_MANAGED_XVFB').map { !it.toBoolean() }.orElse(true)); runtimeModDependencies.add("maven.modrinth:carpet:${project.carpet_version}") }
clientGameTestRecorder { runDir.set(layout.buildDirectory.dir('run/productionClientGameTest')); guiScale.set('2') }
tasks.named('recordClientGameTest') { runTaskName.set('runProductionClientGameTest') }
tasks.named('prepareClientGameTestRun') { mustRunAfter('prepareProductionGameTestRuns') }
tasks.matching { it.name == 'runProductionClientGameTest' }.configureEach { dependsOn('prepareClientGameTestRun') }
dependencies { common(project(':common')) { transitive = false }; testImplementation project(':common'); implementation "io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"; implementation "io.github.brainage04:brainagelib:${project.brainagelib_version}"; productionRuntimeMods "io.github.brainage04:brainagelib:${project.brainagelib_version}"; runtimeOnly "maven.modrinth:carpet:${project.carpet_version}" }
tasks.named('jar') { from project(':common').sourceSets.main.output; duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn project(':common').tasks.named('jar') }
