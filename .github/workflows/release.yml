name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  distribution:
    permissions:
      contents: write
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-multiloader-release.yml@v3.4.0
    with:
      prepare_siblings: BrainageLib@v2.0.0
      additional_artifact_pattern: simpletpa-neoforge-*.jar
      release_name: ${{ format('SimpleTPA {0}', github.ref_name) }}
      modrinth_project_id: ${{ vars.MODRINTH_PROJECT_ID }}
      curseforge_project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
      curseforge_project_slug: simpletpa
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
      curseforge_token: ${{ secrets.CURSEFORGE_TOKEN }}
