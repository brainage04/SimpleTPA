plugins {
	id 'dev.architectury.loom-no-remap'
	id 'dev.architectury.loom'
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
}
workspaceDependencies {
	siblingMaven('BrainageLib') { coordinate.set("io.github.brainage04:brainagelib:${rootProject.brainagelib_version}"); siblingDirectory.set(rootProject.layout.projectDirectory.dir('../BrainageLib')) }
}
repositories {
	maven { url = uri('../BrainageLib/fabric/build/local-repo') }
}
dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	compileOnly "io.github.brainage04:brainagelib:${rootProject.brainagelib_version}"
	testImplementation platform('org.junit:junit-bom:6.0.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
