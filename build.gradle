plugins {
	id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'java'
	base { archivesName = "${rootProject.archives_base_name}-${project.name}" }
	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.neoforged.net/releases/' }
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		ivy {
			name = 'BrainageLibGitHubReleases'
			url = uri('https://github.com/brainage04/BrainageLib/releases/download')
			patternLayout {
				artifact 'v[revision]/[artifact]-[revision].[ext]'
			}
			metadataSources {
				artifact()
			}
			content {
				includeModule 'io.github.brainage04', 'brainagelib'
				includeModule 'io.github.brainage04', 'brainagelib-neoforge'
			}
		}
	}
	java { toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int); withSourcesJar() }
	tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = rootProject.java_version as int }
	tasks.withType(ProcessResources).configureEach {
		def metadataProperties = [version: rootProject.mod_version, minecraft_version: rootProject.minecraft_version, neoforge_version: rootProject.neoforge_version, java_version: rootProject.java_version, brainagelib_version: rootProject.brainagelib_version]
		inputs.properties(metadataProperties)
		filesMatching('META-INF/neoforge.mods.toml') { expand(metadataProperties) }
	}
}

tasks.register('runClientGameTest') { group = 'verification'; dependsOn ':fabric:runProductionClientGameTest' }
tasks.register('recordClientGameTest') { group = 'verification'; dependsOn ':fabric:recordClientGameTest' }

tasks.register('runNeoForgeGameTests') { group = 'verification'; dependsOn ':neoforge:runGameTestServer' }
tasks.register('runAllProductionGameTests') { group = 'verification'; dependsOn ':fabric:runAllProductionGameTests'; dependsOn tasks.named('runNeoForgeGameTests') }
def fabricReleaseJar = project(':fabric').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask)
def neoForgeReleaseJar = project(':neoforge').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask)
tasks.register('collectReleaseArtifacts', Sync) { dependsOn fabricReleaseJar, neoForgeReleaseJar; from fabricReleaseJar.flatMap { it.archiveFile }; from neoForgeReleaseJar.flatMap { it.archiveFile }; into layout.buildDirectory.dir('libs') }
tasks.register('build') { group = 'build'; dependsOn subprojects.collect { it.tasks.named('build') }; dependsOn tasks.named('collectReleaseArtifacts') }
